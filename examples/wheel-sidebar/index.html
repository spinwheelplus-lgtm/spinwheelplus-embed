<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SpinWheelPlus — wheel sidebar embed example</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 40rem;
        margin: 2rem auto;
        padding: 0 1rem;
      }
      .note {
        font-size: 0.875rem;
        color: #555;
      }
      .note a {
        color: inherit;
      }
    </style>
  </head>
  <body>
    <h1>Spin wheel (sidebar)</h1>
    <p class="note">
      Live wheel:
      <a href="https://spinwheelplus.com/wheel/birthday-my-store-wks8vf"
        >Birthday - my store</a
      >. A tab appears on the right edge.
    </p>

    <p>Your page content continues here. Scroll and interact as usual.</p>

    <script
      async
      src="https://spinwheelplus.com/embed/v1/loader.js"
      data-wheel="birthday-my-store-wks8vf"
      data-mode="sidebar"
      data-position="right"
      data-width="360"
      data-collapsed="false"
      data-sound="on"
      data-logo="on"
    ></script>
  </body>
</html>
