<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SpinWheelPlus — mystery box inline embed example</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 40rem;
        margin: 2rem auto;
        padding: 0 1rem;
      }
      .note {
        font-size: 0.875rem;
        color: #555;
      }
      .note a {
        color: inherit;
      }
    </style>
  </head>
  <body>
    <h1>Mystery box (inline)</h1>
    <p class="note">
      Live example:
      <a href="https://spinwheelplus.com/mystery-box/bookstore-birthday-8aj3sj"
        >Bookstore - Birthday</a
      >
      — requires <strong>Allow embed</strong> on the box.
    </p>

    <div id="my-mystery-box"></div>

    <script
      async
      src="https://spinwheelplus.com/embed/v1/loader.js"
      data-box="bookstore-birthday-8aj3sj"
      data-target="#my-mystery-box"
      data-mode="inline"
      data-width="480"
      data-height="520"
      data-sound="on"
      data-logo="on"
      data-bg="brand"
    ></script>
  </body>
</html>
